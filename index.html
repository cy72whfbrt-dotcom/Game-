<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Open Water</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #1a1a1a;
        }

        canvas {
            display: block;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        #hint {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            color: #cfe8ff;
            font: 13px/1.4 system-ui, sans-serif;
            background: rgba(10, 14, 39, 0.55);
            padding: 6px 14px;
            border-radius: 20px;
            pointer-events: none;
            white-space: nowrap;
        }

        #islandPopup {
            display: none;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #10182f;
            border: 1px solid #2c3a63;
            border-radius: 12px;
            padding: 18px 22px;
            color: #e6eefc;
            font: 14px/1.5 system-ui, sans-serif;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            min-width: 220px;
            text-align: center;
        }

        #islandPopup h3 {
            margin: 0 0 10px;
            font-size: 16px;
        }

        #islandPopup .row {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 14px;
        }

        #islandPopup button {
            font: inherit;
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        #attackBtn {
            background: #c0392b;
            color: #fff;
        }

        #closeBtn {
            background: #2c3a63;
            color: #cfe8ff;
        }
    </style>
</head>
<body>
    <canvas id="mapCanvas"></canvas>
    <div id="hint">Ziehen zum Bewegen &middot; Scrollen/Pinch zum Zoomen &middot; tippen zum Angreifen &middot; deine Inseln sind gr&uuml;n</div>
    <div id="islandPopup">
        <h3 id="popupTitle">Insel</h3>
        <div id="popupBody">Diese Insel geh&ouml;rt niemandem.</div>
        <div class="row">
            <button id="attackBtn">Angreifen</button>
            <button id="closeBtn">Schlie&szlig;en</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');

        // Resize canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Map state - zoom is smoothed toward targetZoom for a nicer feel
        let mapState = {
            offsetX: window.innerWidth / 2,
            offsetY: window.innerHeight / 2,
            zoom: 0.35,
            targetZoom: 0.35,
            isDragging: false,
            dragStartX: 0,
            dragStartY: 0,
            lastOffsetX: 0,
            lastOffsetY: 0
        };

        const MIN_ZOOM = 0.06;
        const MAX_ZOOM = 4;

        // Large grid of islands, jittered so it doesn't look too uniform
        const GRID_SIZE = 9; // 9x9 = 81 islands
        const ISLAND_SPACING = 850;
        const ISLAND_RADIUS_MIN = 140;
        const ISLAND_RADIUS_MAX = 230;

        function mulberry32(seed) {
            return function () {
                seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
                let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }
        const rand = mulberry32(1337);

        const islands = [];
        let playerIslandId = null;

        const half = Math.floor(GRID_SIZE / 2);
        let id = 0;
        for (let row = -half; row <= half; row++) {
            for (let col = -half; col <= half; col++) {
                const jitterX = (rand() - 0.5) * ISLAND_SPACING * 0.4;
                const jitterY = (rand() - 0.5) * ISLAND_SPACING * 0.4;
                islands.push({
                    id: id++,
                    x: col * ISLAND_SPACING + jitterX,
                    y: row * ISLAND_SPACING + jitterY,
                    radius: ISLAND_RADIUS_MIN + rand() * (ISLAND_RADIUS_MAX - ISLAND_RADIUS_MIN)
                });
            }
        }

        // Assign the player's island: the one closest to the map center,
        // persisted so the same island stays "yours" between visits.
        function centerIsland() {
            let closest = islands[0];
            let closestDist = Infinity;
            for (const island of islands) {
                const dist = island.x * island.x + island.y * island.y;
                if (dist < closestDist) {
                    closestDist = dist;
                    closest = island;
                }
            }
            return closest;
        }

        const storedId = parseInt(localStorage.getItem('openWaterPlayerIslandId'), 10);
        if (!Number.isNaN(storedId) && islands.some(i => i.id === storedId)) {
            playerIslandId = storedId;
        } else {
            playerIslandId = centerIsland().id;
            localStorage.setItem('openWaterPlayerIslandId', playerIslandId);
        }

        // Islands the player owns (starts with just the home island, grows by attacking)
        let ownedIslands;
        try {
            ownedIslands = new Set(JSON.parse(localStorage.getItem('openWaterOwnedIslands')));
        } catch (e) {
            ownedIslands = new Set();
        }
        ownedIslands.add(playerIslandId);
        saveOwnedIslands();

        function saveOwnedIslands() {
            localStorage.setItem('openWaterOwnedIslands', JSON.stringify([...ownedIslands]));
        }

        // Center the view on the player's island at start
        const startIsland = islands.find(i => i.id === playerIslandId);
        mapState.offsetX = window.innerWidth / 2 - startIsland.x * mapState.zoom;
        mapState.offsetY = window.innerHeight / 2 - startIsland.y * mapState.zoom;

        // Draw map
        function drawMap() {
            // Smoothly ease current zoom toward target zoom
            mapState.zoom += (mapState.targetZoom - mapState.zoom) * 0.18;

            ctx.fillStyle = '#0a0e27';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(mapState.offsetX, mapState.offsetY);
            ctx.scale(mapState.zoom, mapState.zoom);

            const tileSize = 50;
            const visibleX = Math.floor(-mapState.offsetX / mapState.zoom / tileSize) - 2;
            const visibleY = Math.floor(-mapState.offsetY / mapState.zoom / tileSize) - 2;
            const visibleW = Math.ceil(canvas.width / mapState.zoom / tileSize) + 4;
            const visibleH = Math.ceil(canvas.height / mapState.zoom / tileSize) + 4;

            // Base water fill
            ctx.fillStyle = '#1a6faa';
            ctx.fillRect(visibleX * tileSize, visibleY * tileSize, visibleW * tileSize, visibleH * tileSize);

            // Cull islands outside the visible area for performance
            const viewLeft = -mapState.offsetX / mapState.zoom - ISLAND_RADIUS_MAX;
            const viewTop = -mapState.offsetY / mapState.zoom - ISLAND_RADIUS_MAX;
            const viewRight = viewLeft + canvas.width / mapState.zoom + ISLAND_RADIUS_MAX * 2;
            const viewBottom = viewTop + canvas.height / mapState.zoom + ISLAND_RADIUS_MAX * 2;

            for (const island of islands) {
                if (island.x + island.radius < viewLeft || island.x - island.radius > viewRight ||
                    island.y + island.radius < viewTop || island.y - island.radius > viewBottom) {
                    continue;
                }

                const isOwned = ownedIslands.has(island.id);
                const isHome = island.id === playerIslandId;
                ctx.fillStyle = isOwned ? '#4f9a3a' : '#8a8a8a';
                ctx.fillRect(
                    island.x - island.radius,
                    island.y - island.radius,
                    island.radius * 2,
                    island.radius * 2
                );

                if (isOwned) {
                    ctx.strokeStyle = isHome ? '#dff5c8' : '#bfe6a8';
                    ctx.lineWidth = (isHome ? 6 : 4) / mapState.zoom;
                    ctx.strokeRect(
                        island.x - island.radius,
                        island.y - island.radius,
                        island.radius * 2,
                        island.radius * 2
                    );
                }
            }

            ctx.restore();
        }

        // Island tap/click handling (a "tap" is a press+release that barely moved)
        const TAP_MOVE_THRESHOLD = 6;
        let pressMoved = false;

        function screenToWorld(screenX, screenY) {
            return {
                x: (screenX - mapState.offsetX) / mapState.zoom,
                y: (screenY - mapState.offsetY) / mapState.zoom
            };
        }

        function findIslandAt(worldX, worldY) {
            for (const island of islands) {
                if (Math.abs(worldX - island.x) <= island.radius && Math.abs(worldY - island.y) <= island.radius) {
                    return island;
                }
            }
            return null;
        }

        const popup = document.getElementById('islandPopup');
        const popupTitle = document.getElementById('popupTitle');
        const popupBody = document.getElementById('popupBody');
        const attackBtn = document.getElementById('attackBtn');
        const closeBtn = document.getElementById('closeBtn');
        let selectedIslandId = null;

        function openIslandPopup(island) {
            selectedIslandId = island.id;
            const isOwned = ownedIslands.has(island.id);
            const isHome = island.id === playerIslandId;
            popupTitle.textContent = 'Insel #' + (island.id + 1);
            if (isHome) {
                popupBody.textContent = 'Das ist deine Heimatinsel.';
                attackBtn.style.display = 'none';
            } else if (isOwned) {
                popupBody.textContent = 'Diese Insel gehört bereits dir.';
                attackBtn.style.display = 'none';
            } else {
                popupBody.textContent = 'Diese Insel gehört niemandem. Angreifen, um sie zu erobern?';
                attackBtn.style.display = 'inline-block';
            }
            popup.style.display = 'block';
        }

        function closeIslandPopup() {
            popup.style.display = 'none';
            selectedIslandId = null;
        }

        attackBtn.addEventListener('click', () => {
            if (selectedIslandId === null) return;
            ownedIslands.add(selectedIslandId);
            saveOwnedIslands();
            closeIslandPopup();
        });

        closeBtn.addEventListener('click', closeIslandPopup);

        function handleTap(screenX, screenY) {
            const world = screenToWorld(screenX, screenY);
            const island = findIslandAt(world.x, world.y);
            if (island) {
                openIslandPopup(island);
            }
        }

        // Mouse events
        document.addEventListener('mousedown', (e) => {
            mapState.isDragging = true;
            pressMoved = false;
            mapState.dragStartX = e.clientX;
            mapState.dragStartY = e.clientY;
            mapState.lastOffsetX = mapState.offsetX;
            mapState.lastOffsetY = mapState.offsetY;
        });

        document.addEventListener('mousemove', (e) => {
            if (mapState.isDragging) {
                const deltaX = e.clientX - mapState.dragStartX;
                const deltaY = e.clientY - mapState.dragStartY;
                if (Math.abs(deltaX) > TAP_MOVE_THRESHOLD || Math.abs(deltaY) > TAP_MOVE_THRESHOLD) {
                    pressMoved = true;
                }
                mapState.offsetX = mapState.lastOffsetX + deltaX;
                mapState.offsetY = mapState.lastOffsetY + deltaY;
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (mapState.isDragging && !pressMoved) {
                handleTap(e.clientX, e.clientY);
            }
            mapState.isDragging = false;
        });

        // Zoom with mouse wheel / trackpad, zooming toward the cursor
        document.addEventListener('wheel', (e) => {
            e.preventDefault();

            const oldZoom = mapState.targetZoom;
            const zoomFactor = Math.exp(-e.deltaY * 0.0015);
            let newZoom = oldZoom * zoomFactor;
            newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));

            const mouseX = e.clientX;
            const mouseY = e.clientY;

            // Keep the point under the cursor stable while zooming
            const worldX = (mouseX - mapState.offsetX) / mapState.zoom;
            const worldY = (mouseY - mapState.offsetY) / mapState.zoom;

            mapState.targetZoom = newZoom;
            mapState.offsetX = mouseX - worldX * newZoom;
            mapState.offsetY = mouseY - worldY * newZoom;
        }, { passive: false });

        // Touch support
        let touchStartDistance = 0;
        let touchStartZoom = 1;
        let touchMidX = 0;
        let touchMidY = 0;

        document.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                mapState.isDragging = true;
                pressMoved = false;
                mapState.dragStartX = e.touches[0].clientX;
                mapState.dragStartY = e.touches[0].clientY;
                mapState.lastOffsetX = mapState.offsetX;
                mapState.lastOffsetY = mapState.offsetY;
            } else if (e.touches.length === 2) {
                mapState.isDragging = false;
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                touchStartDistance = Math.sqrt(dx * dx + dy * dy);
                touchStartZoom = mapState.targetZoom;
                touchMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                touchMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            }
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && mapState.isDragging) {
                const deltaX = e.touches[0].clientX - mapState.dragStartX;
                const deltaY = e.touches[0].clientY - mapState.dragStartY;
                if (Math.abs(deltaX) > TAP_MOVE_THRESHOLD || Math.abs(deltaY) > TAP_MOVE_THRESHOLD) {
                    pressMoved = true;
                }
                mapState.offsetX = mapState.lastOffsetX + deltaX;
                mapState.offsetY = mapState.lastOffsetY + deltaY;
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                let newZoom = touchStartZoom * (distance / touchStartDistance);
                newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));

                const worldX = (touchMidX - mapState.offsetX) / mapState.zoom;
                const worldY = (touchMidY - mapState.offsetY) / mapState.zoom;

                mapState.targetZoom = newZoom;
                mapState.offsetX = touchMidX - worldX * newZoom;
                mapState.offsetY = touchMidY - worldY * newZoom;
            }
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if (mapState.isDragging && !pressMoved && e.changedTouches.length === 1) {
                handleTap(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }
            mapState.isDragging = false;
        });

        // Animation loop
        function animate() {
            drawMap();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
