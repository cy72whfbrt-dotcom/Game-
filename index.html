<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Open Water</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #1a1a1a;
        }

        canvas {
            display: block;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        #hint {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            color: #cfe8ff;
            font: 13px/1.4 system-ui, sans-serif;
            background: rgba(10, 14, 39, 0.55);
            padding: 6px 14px;
            border-radius: 20px;
            pointer-events: none;
            white-space: nowrap;
            text-align: center;
            max-width: 90vw;
        }

        #hud {
            position: fixed;
            left: 16px;
            top: 16px;
            display: flex;
            gap: 10px;
            color: #e6eefc;
            font: 14px/1.4 system-ui, sans-serif;
        }

        #hud .stat {
            background: rgba(10, 14, 39, 0.65);
            border: 1px solid #2c3a63;
            border-radius: 10px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #islandPopup {
            display: none;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #10182f;
            border: 1px solid #2c3a63;
            border-radius: 12px;
            padding: 18px 22px;
            color: #e6eefc;
            font: 14px/1.5 system-ui, sans-serif;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            min-width: 240px;
            text-align: center;
        }

        #islandPopup h3 {
            margin: 0 0 10px;
            font-size: 16px;
        }

        #islandPopup .stats {
            text-align: left;
            font-size: 13px;
            color: #b9c6e6;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 4px;
        }

        #islandPopup .row {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 14px;
        }

        #islandPopup button {
            font: inherit;
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        #islandPopup button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #upgradeBtn, #sendBtn, #confirmBtn {
            background: #2e8b57;
            color: #fff;
        }

        #attackBtn {
            background: #c0392b;
            color: #fff;
        }

        #scoutBtn {
            background: #3b6fa0;
            color: #fff;
        }

        #closeBtn, #backBtn {
            background: #2c3a63;
            color: #cfe8ff;
        }
    </style>
</head>
<body>
    <canvas id="mapCanvas"></canvas>
    <div id="hud">
        <div class="stat">&#129689; <span id="coinCount">0</span></div>
        <div class="stat">&#9876;&#65039; <span id="troopCount">0</span></div>
    </div>
    <div id="hint">Ziehen zum Bewegen &middot; Zoomen mit Scroll/Pinch &middot; Insel antippen f&uuml;r Infos &amp; Aktionen</div>
    <div id="islandPopup">
        <h3 id="popupTitle">Insel</h3>
        <div id="popupStats" class="stats"></div>
        <div class="row">
            <button id="upgradeBtn">Aufwerten</button>
            <button id="sendBtn">Truppen verschicken</button>
            <button id="attackBtn">Angreifen</button>
            <button id="scoutBtn">Sp&auml;hen</button>
            <button id="confirmBtn">Best&auml;tigen</button>
            <button id="backBtn">Zur&uuml;ck</button>
            <button id="closeBtn">Schlie&szlig;en</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Map state - zoom eases toward targetZoom; zoomAnchor keeps the point
        // under the cursor/fingers fixed on screen while that easing plays out.
        let mapState = {
            offsetX: window.innerWidth / 2,
            offsetY: window.innerHeight / 2,
            zoom: 0.35,
            targetZoom: 0.35,
            isDragging: false,
            dragStartX: 0,
            dragStartY: 0,
            lastOffsetX: 0,
            lastOffsetY: 0
        };
        let zoomAnchor = null; // { screenX, screenY, worldX, worldY }

        const MIN_ZOOM = 0.06;
        const MAX_ZOOM = 4;

        // Grid of islands - all the same size so the map reads consistently
        const GRID_SIZE = 9; // 9x9 = 81 islands
        const ISLAND_SPACING = 850;
        const ISLAND_RADIUS = 180;
        const NEUTRAL_DEFENSE_MAX = 100;
        const NEUTRAL_DEFENSE_MIN = 20;

        function mulberry32(seed) {
            return function () {
                seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
                let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }
        const rand = mulberry32(1337);

        // Game balance
        const BASE_DEFENSE = 100;
        const DEFENSE_PER_LEVEL = 50;
        const COINS_PER_LEVEL = 10;
        const TROOPS_PER_LEVEL = 5;
        const UPGRADE_BASE_COST = 150;

        function defenseForLevel(level) {
            return BASE_DEFENSE + (level - 1) * DEFENSE_PER_LEVEL;
        }
        function upgradeCost(level) {
            return level * UPGRADE_BASE_COST;
        }

        // Build the island grid
        const islands = [];
        let playerIslandId = null;

        const half = Math.floor(GRID_SIZE / 2);
        let id = 0;
        for (let row = -half; row <= half; row++) {
            for (let col = -half; col <= half; col++) {
                const jitterX = (rand() - 0.5) * ISLAND_SPACING * 0.3;
                const jitterY = (rand() - 0.5) * ISLAND_SPACING * 0.3;
                islands.push({
                    id: id++,
                    row,
                    col,
                    x: col * ISLAND_SPACING + jitterX,
                    y: row * ISLAND_SPACING + jitterY,
                    radius: ISLAND_RADIUS,
                    // Troops garrisoned on a neutral (unowned) island; also its defense
                    neutralDefense: NEUTRAL_DEFENSE_MIN + Math.floor(rand() * (NEUTRAL_DEFENSE_MAX - NEUTRAL_DEFENSE_MIN + 1))
                });
            }
        }
        const islandById = {};
        for (const island of islands) islandById[island.id] = island;

        function centerIsland() {
            let closest = islands[0];
            let closestDist = Infinity;
            for (const island of islands) {
                const dist = island.x * island.x + island.y * island.y;
                if (dist < closestDist) {
                    closestDist = dist;
                    closest = island;
                }
            }
            return closest;
        }

        const storedId = parseInt(localStorage.getItem('openWaterPlayerIslandId'), 10);
        if (!Number.isNaN(storedId) && islandById[storedId]) {
            playerIslandId = storedId;
        } else {
            playerIslandId = centerIsland().id;
            localStorage.setItem('openWaterPlayerIslandId', playerIslandId);
        }

        // Islands the player owns, each with its own level and troop garrison
        let ownedIslands;
        try {
            ownedIslands = new Set(JSON.parse(localStorage.getItem('openWaterOwnedIslands')));
        } catch (e) {
            ownedIslands = new Set();
        }
        ownedIslands.add(playerIslandId);

        let islandLevels;
        try {
            islandLevels = JSON.parse(localStorage.getItem('openWaterIslandLevels')) || {};
        } catch (e) {
            islandLevels = {};
        }
        let islandTroops;
        try {
            islandTroops = JSON.parse(localStorage.getItem('openWaterIslandTroops')) || {};
        } catch (e) {
            islandTroops = {};
        }
        for (const ownedId of ownedIslands) {
            if (!islandLevels[ownedId]) islandLevels[ownedId] = 1;
            if (!islandTroops[ownedId]) islandTroops[ownedId] = 0;
        }

        let coins = parseInt(localStorage.getItem('openWaterCoins'), 10) || 0;

        // Neutral islands hide their troop count until scouted
        let scoutedIslands;
        try {
            scoutedIslands = new Set(JSON.parse(localStorage.getItem('openWaterScoutedIslands')));
        } catch (e) {
            scoutedIslands = new Set();
        }

        function saveGame() {
            localStorage.setItem('openWaterOwnedIslands', JSON.stringify([...ownedIslands]));
            localStorage.setItem('openWaterIslandLevels', JSON.stringify(islandLevels));
            localStorage.setItem('openWaterIslandTroops', JSON.stringify(islandTroops));
            localStorage.setItem('openWaterCoins', String(coins));
            localStorage.setItem('openWaterScoutedIslands', JSON.stringify([...scoutedIslands]));
        }

        const coinCountEl = document.getElementById('coinCount');
        const troopCountEl = document.getElementById('troopCount');
        function totalTroops() {
            let sum = 0;
            for (const ownedId of ownedIslands) sum += islandTroops[ownedId] || 0;
            return sum;
        }
        function updateHud() {
            coinCountEl.textContent = coins;
            troopCountEl.textContent = totalTroops();
        }
        updateHud();

        // Every owned island produces coins (shared treasury) and troops
        // (kept locally on that island) once per second.
        setInterval(() => {
            for (const ownedId of ownedIslands) {
                const level = islandLevels[ownedId] || 1;
                coins += COINS_PER_LEVEL * level;
                islandTroops[ownedId] = (islandTroops[ownedId] || 0) + TROOPS_PER_LEVEL * level;
            }
            updateHud();
            saveGame();
        }, 1000);

        // Center the view on the player's island at start
        const startIsland = islandById[playerIslandId];
        mapState.offsetX = window.innerWidth / 2 - startIsland.x * mapState.zoom;
        mapState.offsetY = window.innerHeight / 2 - startIsland.y * mapState.zoom;

        // While pendingAttackTargetId is set, every owned island blinks and the
        // next one tapped becomes the attack base. While pendingSendFromId is
        // set, every OTHER owned island blinks and the next one tapped
        // receives all of that island's troops. Only one of the two is ever
        // active at a time.
        let pendingAttackTargetId = null;
        let pendingSendFromId = null;

        const hintEl = document.getElementById('hint');
        const defaultHint = hintEl.textContent;
        let hintResetTimer = null;
        function flashHint(text, ms) {
            clearTimeout(hintResetTimer);
            hintEl.textContent = text;
            if (ms) hintResetTimer = setTimeout(() => { hintEl.textContent = defaultHint; }, ms);
        }

        function drawMap() {
            // Ease current zoom toward target zoom
            mapState.zoom += (mapState.targetZoom - mapState.zoom) * 0.18;

            // Keep the anchored world point fixed under the anchored screen point
            // at every step of the easing animation - this is what stops the
            // "picture jumps while zooming" drift.
            if (zoomAnchor) {
                mapState.offsetX = zoomAnchor.screenX - zoomAnchor.worldX * mapState.zoom;
                mapState.offsetY = zoomAnchor.screenY - zoomAnchor.worldY * mapState.zoom;
                if (Math.abs(mapState.zoom - mapState.targetZoom) < 0.0005) {
                    mapState.zoom = mapState.targetZoom;
                    zoomAnchor = null;
                }
            }

            ctx.fillStyle = '#0a0e27';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(mapState.offsetX, mapState.offsetY);
            ctx.scale(mapState.zoom, mapState.zoom);

            const tileSize = 50;
            const visibleX = Math.floor(-mapState.offsetX / mapState.zoom / tileSize) - 2;
            const visibleY = Math.floor(-mapState.offsetY / mapState.zoom / tileSize) - 2;
            const visibleW = Math.ceil(canvas.width / mapState.zoom / tileSize) + 4;
            const visibleH = Math.ceil(canvas.height / mapState.zoom / tileSize) + 4;

            ctx.fillStyle = '#1a6faa';
            ctx.fillRect(visibleX * tileSize, visibleY * tileSize, visibleW * tileSize, visibleH * tileSize);

            const viewLeft = -mapState.offsetX / mapState.zoom - ISLAND_RADIUS;
            const viewTop = -mapState.offsetY / mapState.zoom - ISLAND_RADIUS;
            const viewRight = viewLeft + canvas.width / mapState.zoom + ISLAND_RADIUS * 2;
            const viewBottom = viewTop + canvas.height / mapState.zoom + ISLAND_RADIUS * 2;

            const blinkAlpha = 0.35 + 0.65 * Math.abs(Math.sin(Date.now() / 280));

            for (const island of islands) {
                if (island.x + island.radius < viewLeft || island.x - island.radius > viewRight ||
                    island.y + island.radius < viewTop || island.y - island.radius > viewBottom) {
                    continue;
                }

                const isOwned = ownedIslands.has(island.id);
                ctx.fillStyle = isOwned ? '#4f9a3a' : '#8a8a8a';
                ctx.fillRect(
                    island.x - island.radius,
                    island.y - island.radius,
                    island.radius * 2,
                    island.radius * 2
                );

                const isSelectable =
                    (pendingAttackTargetId !== null && isOwned) ||
                    (pendingSendFromId !== null && isOwned && island.id !== pendingSendFromId);

                if (isSelectable) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, ' + blinkAlpha.toFixed(2) + ')';
                    ctx.lineWidth = 10 / mapState.zoom;
                    ctx.strokeRect(
                        island.x - island.radius,
                        island.y - island.radius,
                        island.radius * 2,
                        island.radius * 2
                    );
                } else if (island.id === pendingSendFromId) {
                    ctx.strokeStyle = '#ffd23f';
                    ctx.lineWidth = 8 / mapState.zoom;
                    ctx.strokeRect(
                        island.x - island.radius,
                        island.y - island.radius,
                        island.radius * 2,
                        island.radius * 2
                    );
                }

                // Label: level + garrisoned troops for owned islands, defense for neutral ones
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                if (isOwned) {
                    ctx.font = '56px system-ui, sans-serif';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('Lvl ' + (islandLevels[island.id] || 1), island.x, island.y);
                    ctx.font = '44px system-ui, sans-serif';
                    ctx.textBaseline = 'top';
                    ctx.fillText(String(islandTroops[island.id] || 0) + ' Truppen', island.x, island.y + 4);
                } else {
                    ctx.font = '56px system-ui, sans-serif';
                    ctx.textBaseline = 'middle';
                    const label = scoutedIslands.has(island.id) ? String(island.neutralDefense) : '?';
                    ctx.fillText(label, island.x, island.y);
                }
            }

            ctx.restore();
        }

        // Island tap/click handling (a "tap" is a press+release that barely moved)
        const TAP_MOVE_THRESHOLD = 6;
        let pressMoved = false;

        function screenToWorld(screenX, screenY) {
            return {
                x: (screenX - mapState.offsetX) / mapState.zoom,
                y: (screenY - mapState.offsetY) / mapState.zoom
            };
        }

        function findIslandAt(worldX, worldY) {
            for (const island of islands) {
                if (Math.abs(worldX - island.x) <= island.radius && Math.abs(worldY - island.y) <= island.radius) {
                    return island;
                }
            }
            return null;
        }

        const popup = document.getElementById('islandPopup');
        const popupTitle = document.getElementById('popupTitle');
        const popupStats = document.getElementById('popupStats');
        const upgradeBtn = document.getElementById('upgradeBtn');
        const sendBtn = document.getElementById('sendBtn');
        const attackBtn = document.getElementById('attackBtn');
        const scoutBtn = document.getElementById('scoutBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const backBtn = document.getElementById('backBtn');
        const closeBtn = document.getElementById('closeBtn');
        let popupIslandId = null;
        // 'menu' lists the available actions for the tapped island; 'upgrade'
        // is the only remaining preview+confirm screen; 'result' is the
        // read-only battle report shown right after an attack resolves.
        let popupView = 'menu';
        let lastResultHtml = '';
        let previewSourceId = null; // base picked for an attack awaiting confirmation

        function openIslandPopup(island) {
            popupIslandId = island.id;
            popupView = 'menu';
            renderPopup();
        }

        function closeIslandPopup() {
            popup.style.display = 'none';
            popupIslandId = null;
            popupView = 'menu';
            previewSourceId = null;
        }

        function hideAllButtons() {
            upgradeBtn.style.display = 'none';
            sendBtn.style.display = 'none';
            attackBtn.style.display = 'none';
            scoutBtn.style.display = 'none';
            confirmBtn.style.display = 'none';
            backBtn.style.display = 'none';
        }

        // Renders whichever screen (menu, the upgrade preview, or a battle
        // result) is currently active - never performs any game action itself.
        function renderPopup() {
            if (popupView === 'result') {
                popupTitle.textContent = 'Angriffsergebnis';
                popupStats.innerHTML = lastResultHtml;
                hideAllButtons();
                popup.style.display = 'block';
                return;
            }

            const island = islandById[popupIslandId];
            if (!island) return;
            hideAllButtons();
            const isOwned = ownedIslands.has(island.id);

            if (isOwned) {
                const level = islandLevels[island.id] || 1;
                const troopsHere = islandTroops[island.id] || 0;

                if (popupView === 'upgrade') {
                    const cost = upgradeCost(level);
                    popupTitle.textContent = 'Insel #' + (island.id + 1) + ' aufwerten';
                    popupStats.innerHTML =
                        'Jetzt: Level ' + level + ', Verteidigung ' + defenseForLevel(level) + ', ' +
                        (COINS_PER_LEVEL * level) + ' M&uuml;nzen/s, ' + (TROOPS_PER_LEVEL * level) + ' Truppen/s<br>' +
                        'Danach: Level ' + (level + 1) + ', Verteidigung ' + defenseForLevel(level + 1) + ', ' +
                        (COINS_PER_LEVEL * (level + 1)) + ' M&uuml;nzen/s, ' + (TROOPS_PER_LEVEL * (level + 1)) + ' Truppen/s<br><br>' +
                        'Kosten: ' + cost + ' M&uuml;nzen';
                    confirmBtn.style.display = 'inline-block';
                    confirmBtn.disabled = coins < cost;
                    backBtn.style.display = 'inline-block';
                } else {
                    popupTitle.textContent = 'Insel #' + (island.id + 1) + (island.id === playerIslandId ? ' (Heimat)' : ' (deine)');
                    popupStats.innerHTML =
                        'Level: ' + level + '<br>' +
                        'Truppen hier: ' + troopsHere + '<br>' +
                        'Verteidigung: ' + defenseForLevel(level) + '<br>' +
                        'Produktion: ' + (COINS_PER_LEVEL * level) + ' M&uuml;nzen/s, ' + (TROOPS_PER_LEVEL * level) + ' Truppen/s';
                    upgradeBtn.style.display = 'inline-block';
                    sendBtn.style.display = 'inline-block';
                    sendBtn.disabled = troopsHere <= 0 || ownedIslands.size <= 1;
                }
            } else {
                const scouted = scoutedIslands.has(island.id);

                if (popupView === 'preview') {
                    const myTroops = previewSourceId !== null ? (islandTroops[previewSourceId] || 0) : 0;
                    popupTitle.textContent = 'Insel #' + (island.id + 1) + ' angreifen?';
                    popupStats.innerHTML =
                        'Meine Truppen: ' + myTroops + ' (Insel #' + (previewSourceId + 1) + ')<br>' +
                        'Gegner Truppen (Verteidigung): ' + (scouted ? island.neutralDefense : '?');
                    attackBtn.textContent = 'Angreifen';
                    attackBtn.style.display = 'inline-block';
                    attackBtn.disabled = myTroops <= 0;
                    backBtn.style.display = 'inline-block';
                } else {
                    popupTitle.textContent = 'Insel #' + (island.id + 1) + ' (unbesetzt)';
                    popupStats.innerHTML = 'Truppen auf der Insel: ' + (scouted ? island.neutralDefense : 'unbekannt - erst sp&auml;hen');
                    attackBtn.textContent = 'Angreifen';
                    attackBtn.style.display = 'inline-block';
                    scoutBtn.style.display = 'inline-block';
                    scoutBtn.disabled = scouted;
                }
            }
            popup.style.display = 'block';
        }

        upgradeBtn.addEventListener('click', () => {
            popupView = 'upgrade';
            renderPopup();
        });

        backBtn.addEventListener('click', () => {
            if (popupView === 'preview') {
                // Go back to blink-picking a different base
                const targetId = popupIslandId;
                previewSourceId = null;
                pendingAttackTargetId = targetId;
                closeIslandPopup();
                flashHint('Wähle die Insel, von der aus du angreifen willst - tippe sie auf der Karte an.');
                return;
            }
            popupView = 'menu';
            renderPopup();
        });

        confirmBtn.addEventListener('click', () => {
            if (popupIslandId === null || popupView !== 'upgrade') return;
            const level = islandLevels[popupIslandId] || 1;
            const cost = upgradeCost(level);
            if (coins < cost) return;
            coins -= cost;
            islandLevels[popupIslandId] = level + 1;
            updateHud();
            saveGame();
            popupView = 'menu';
            renderPopup();
        });

        attackBtn.addEventListener('click', () => {
            if (popupView === 'preview') {
                // Confirmed - actually run the attack now
                const target = islandById[popupIslandId];
                const sourceId = previewSourceId;
                if (!target || sourceId === null) return;
                const myTroops = islandTroops[sourceId] || 0;
                if (myTroops <= 0) return;

                // Win if the sent troops beat the defense, losing troops equal
                // to the defense either way (or the whole force if it fails)
                const won = myTroops > target.neutralDefense;
                const remaining = won ? myTroops - target.neutralDefense : 0;
                if (won) {
                    islandTroops[target.id] = remaining;
                    islandTroops[sourceId] = 0;
                    ownedIslands.add(target.id);
                    islandLevels[target.id] = 1;
                } else {
                    islandTroops[sourceId] = 0;
                }
                scoutedIslands.add(target.id);
                previewSourceId = null;
                updateHud();
                saveGame();
                showAttackResult(sourceId, target, myTroops, won, remaining);
                return;
            }

            // On the menu of a neutral island: close the popup, blink every
            // owned island, and wait for the player to tap the attack base.
            pendingAttackTargetId = popupIslandId;
            closeIslandPopup();
            flashHint('Wähle die Insel, von der aus du angreifen willst - tippe sie auf der Karte an.');
        });

        scoutBtn.addEventListener('click', () => {
            if (popupIslandId === null) return;
            scoutedIslands.add(popupIslandId);
            saveGame();
            renderPopup();
        });

        // "Truppen verschicken": close the popup, blink every OTHER owned
        // island, and wait for the player to tap the destination.
        sendBtn.addEventListener('click', () => {
            pendingSendFromId = popupIslandId;
            closeIslandPopup();
            flashHint('Wähle die Zielinsel für deine Truppen - tippe sie auf der Karte an.');
        });

        closeBtn.addEventListener('click', closeIslandPopup);

        function showAttackResult(sourceId, target, myTroops, won, remaining) {
            lastResultHtml =
                'Meine Truppen: ' + myTroops + '<br>' +
                'Gegner Truppen (Verteidigung): ' + target.neutralDefense + '<br>' +
                'Ergebnis: ' + (won
                    ? 'Sieg - ' + remaining + ' Truppen übrig, Insel erobert!'
                    : 'Niederlage - alle Truppen verloren.');
            popupIslandId = null;
            popupView = 'result';
            renderPopup();
        }

        function handleTap(screenX, screenY) {
            const world = screenToWorld(screenX, screenY);
            const island = findIslandAt(world.x, world.y);
            if (!island) return;

            if (pendingAttackTargetId !== null) {
                const target = islandById[pendingAttackTargetId];
                pendingAttackTargetId = null;
                hintEl.textContent = defaultHint;

                if (ownedIslands.has(island.id) && target && (islandTroops[island.id] || 0) > 0) {
                    // Show the comparison and wait for an explicit "Angreifen"
                    // tap before anything actually happens
                    previewSourceId = island.id;
                    popupIslandId = target.id;
                    popupView = 'preview';
                    renderPopup();
                    return;
                }
                // Tapped something other than an owned island - just cancel
            }

            if (pendingSendFromId !== null) {
                const fromId = pendingSendFromId;
                pendingSendFromId = null;
                hintEl.textContent = defaultHint;

                if (ownedIslands.has(island.id) && island.id !== fromId) {
                    const sent = islandTroops[fromId] || 0;
                    islandTroops[island.id] = (islandTroops[island.id] || 0) + sent;
                    islandTroops[fromId] = 0;
                    updateHud();
                    saveGame();
                    flashHint(sent + ' Truppen zu Insel #' + (island.id + 1) + ' verschickt.', 2500);
                    return;
                }
                // Tapped the source again or a neutral island - just cancel
            }

            openIslandPopup(island);
        }

        // Clicks/taps on the popup or HUD must never reach the map - without
        // this, a button press bubbles up to these document-level listeners
        // and fires as a map tap at the button's screen position (mousedown
        // -> mouseup -> click is the real DOM order, so the tap would even
        // land *before* the button's own click handler ran).
        function isUiElement(target) {
            return !!(target && target.closest && (target.closest('#islandPopup') || target.closest('#hud')));
        }

        // Mouse events
        document.addEventListener('mousedown', (e) => {
            if (isUiElement(e.target)) return;
            mapState.isDragging = true;
            pressMoved = false;
            zoomAnchor = null;
            mapState.dragStartX = e.clientX;
            mapState.dragStartY = e.clientY;
            mapState.lastOffsetX = mapState.offsetX;
            mapState.lastOffsetY = mapState.offsetY;
        });

        document.addEventListener('mousemove', (e) => {
            if (mapState.isDragging) {
                const deltaX = e.clientX - mapState.dragStartX;
                const deltaY = e.clientY - mapState.dragStartY;
                if (Math.abs(deltaX) > TAP_MOVE_THRESHOLD || Math.abs(deltaY) > TAP_MOVE_THRESHOLD) {
                    pressMoved = true;
                }
                mapState.offsetX = mapState.lastOffsetX + deltaX;
                mapState.offsetY = mapState.lastOffsetY + deltaY;
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (mapState.isDragging && !pressMoved && !isUiElement(e.target)) {
                handleTap(e.clientX, e.clientY);
            }
            mapState.isDragging = false;
        });

        // Zoom with mouse wheel / trackpad, zooming toward the cursor.
        // A zoomAnchor is set once here; drawMap() re-applies it every frame
        // while the eased zoom catches up, so the anchored point never drifts.
        document.addEventListener('wheel', (e) => {
            e.preventDefault();

            const zoomFactor = Math.exp(-e.deltaY * 0.0015);
            let newZoom = mapState.targetZoom * zoomFactor;
            newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));

            const world = screenToWorld(e.clientX, e.clientY);
            mapState.targetZoom = newZoom;
            zoomAnchor = { screenX: e.clientX, screenY: e.clientY, worldX: world.x, worldY: world.y };
        }, { passive: false });

        // Touch support
        let touchStartDistance = 0;
        let touchStartZoom = 1;

        document.addEventListener('touchstart', (e) => {
            if (isUiElement(e.target)) return;
            if (e.touches.length === 1) {
                mapState.isDragging = true;
                pressMoved = false;
                zoomAnchor = null;
                mapState.dragStartX = e.touches[0].clientX;
                mapState.dragStartY = e.touches[0].clientY;
                mapState.lastOffsetX = mapState.offsetX;
                mapState.lastOffsetY = mapState.offsetY;
            } else if (e.touches.length === 2) {
                mapState.isDragging = false;
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                touchStartDistance = Math.sqrt(dx * dx + dy * dy);
                touchStartZoom = mapState.targetZoom;
                const touchMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const touchMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                const world = screenToWorld(touchMidX, touchMidY);
                zoomAnchor = { screenX: touchMidX, screenY: touchMidY, worldX: world.x, worldY: world.y };
            }
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && mapState.isDragging) {
                const deltaX = e.touches[0].clientX - mapState.dragStartX;
                const deltaY = e.touches[0].clientY - mapState.dragStartY;
                if (Math.abs(deltaX) > TAP_MOVE_THRESHOLD || Math.abs(deltaY) > TAP_MOVE_THRESHOLD) {
                    pressMoved = true;
                }
                mapState.offsetX = mapState.lastOffsetX + deltaX;
                mapState.offsetY = mapState.lastOffsetY + deltaY;
            } else if (e.touches.length === 2 && zoomAnchor) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                let newZoom = touchStartZoom * (distance / touchStartDistance);
                newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));
                mapState.targetZoom = newZoom;
                // Keep the pinch anchor's world point; only zoom changes here
            }
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if (mapState.isDragging && !pressMoved && e.changedTouches.length === 1 && !isUiElement(e.target)) {
                handleTap(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }
            mapState.isDragging = false;
        });

        function animate() {
            drawMap();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
