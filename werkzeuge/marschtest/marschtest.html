<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Marschtest Karte</title>
<link rel="stylesheet" href="../../Game/schrift/schrift.css">
<style>
  :root { --tx-1: #eee6d4; --gold: #eab24a; --ui: 'Inter', system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: #1c2416; overflow: hidden; touch-action: none; font-family: var(--ui); }
  #karte, #marsch { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #karte { cursor: grab; }
  #marsch { pointer-events: none; }
  #info { display: none; }                               /* (Infozeile der Karten-Testdatei: hier #zeile) */
  #leiste { position: fixed; left: 50%; top: max(8px, env(safe-area-inset-top)); transform: translateX(-50%); display: grid;
    grid-template-columns: repeat(10, auto); width: max-content; gap: 6px; background: rgba(20, 16, 10, .8); border: 1px solid #8a6a3a; border-radius: 12px; padding: 6px; z-index: 3; }
  #leiste button, #mehr button { font: 600 13px var(--ui); color: #f3e2bd; background: #4a3720; border: 1px solid #a07c45; border-radius: 8px;
    padding: 0 10px; min-width: 44px; height: 44px; white-space: nowrap; }
  #leiste button.an, #mehr button.an { background: #8a6326; color: #fff6dc; }
  #zeile { position: fixed; left: 10px; color: #f3e2bd; background: rgba(20, 16, 10, .76); border: 1px solid #6b5230; border-radius: 8px;
    padding: 5px 9px; font: 12px/1.45 var(--ui); pointer-events: none; z-index: 2; max-width: calc(100% - 40px); }
  #zeile b { color: #e4c886; }
  #bps { position: fixed; right: 10px; color: #fff6dc; background: rgba(20, 16, 10, .8); border: 1px solid #8a6a3a; border-radius: 8px;
    padding: 4px 8px; font: 700 13px var(--ui); pointer-events: none; display: none; z-index: 2; }
  #bps.schlecht { color: #ff8d82; }
  #mehr { position: fixed; right: 10px; display: none; grid-template-columns: repeat(2, auto); gap: 6px; max-height: calc(100% - 150px); overflow-y: auto; background: rgba(20, 16, 10, .9);
    border: 1px solid #8a6a3a; border-radius: 12px; padding: 8px; z-index: 4; }
  #mehr.offen { display: grid; }
  #mehr b { grid-column: 1 / -1; font: 700 11px var(--ui); color: #e4c886; text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }
  #knoepfe { position: fixed; left: 0; top: 0; width: 0; height: 0; z-index: 2; }
  #knoepfe button { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; padding: 0;
    background: radial-gradient(circle at 50% 35%, #3a4558, #151b26); border: 2px solid #d9b46a; box-shadow: 0 2px 6px rgba(0, 0, 0, .6); }
  #knoepfe button img { width: 30px; height: 30px; display: block; margin: auto; }
  #knoepfe button span { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); font: 700 11px var(--ui); color: #fff6dc;
    text-shadow: 0 1px 2px #000, 0 0 3px #000; white-space: nowrap; }
  #knoepfe button i { position: absolute; right: -6px; bottom: -4px; font: 700 10px var(--ui); font-style: normal; color: #1d1406; background: var(--gold);
    border-radius: 8px; padding: 1px 4px; }
  #karte-info { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(360px, calc(100% - 32px));
    color: var(--tx-1); background: rgba(14, 16, 22, .92); border: 1px solid #8a6a3a; border-radius: 12px; padding: 10px 12px; font: 13px/1.5 var(--ui);
    display: none; z-index: 3; box-shadow: 0 4px 14px rgba(0, 0, 0, .6); }
  #karte-info.offen { display: block; }
  #karte-info h3 { margin: 0 0 4px; font: 700 15px 'Cinzel', Georgia, serif; color: #f0dfb0; }
  #karte-info .zu { position: absolute; right: 6px; top: 4px; width: 32px; height: 32px; background: none; border: 0; color: #c0b7a3; font: 700 18px var(--ui); }
  @media (max-width: 699px) {
    #leiste { grid-template-columns: repeat(5, 1fr); width: calc(100% - 32px); box-sizing: border-box; }
    #leiste button { padding: 0 3px; font-size: 11px; line-height: 1.15; white-space: normal; }
  }
</style>
</head>
<body>
<canvas id="karte"></canvas>
<canvas id="marsch"></canvas>
<div id="info"><div id="stufe"></div><div id="legende"></div></div>
<div id="leiste">
  <button data-zustand="marsch">Marsch</button><button data-zustand="sammeln">Sammeln</button><button data-zustand="spaeher">Späher</button>
  <button data-zustand="rally">Rally</button><button data-zustand="kampf">Kampf</button>
  <button data-zustand="sieg">Sieg</button><button data-zustand="niederlage">Nieder&shy;lage</button><button data-zustand="zurueck">Zurück&shy;rufen</button>
  <button id="zoom">Zoom: Nah</button><button id="mehr-knopf">Mehr ▾</button>
</div>
<div id="mehr">
  <b>Einstellungen</b>
  <button id="seite">Seite: eigen</button><button id="tempo">Tempo ×1</button><button id="gedraenge">Gedränge</button>
  <button id="nebel" class="an">Nebel an</button><button id="nacht">Nacht aus</button><button id="held">Held an</button><button id="tore">Tore zu</button>
  <b>Gemeinsamer Kampf</b>
  <button id="drei">3 Angriffe</button><button data-dazu="eigen">+ eigener Marsch</button><button data-dazu="bund">+ Verbündeter</button>
  <button data-dazu="gegner">+ Verstärkung Gegner</button><button data-dazu="dritter">Dritter Spieler</button>
  <b>Ergebnis wie im Spiel</b>
  <button data-erg="turm">Turm erobern</button><button data-erg="lager">Lager</button><button data-erg="lagerSchwach">Lager zu schwach</button>
  <button data-erg="meinSchild">Dein Schild</button><button data-erg="kevinSchild">Kevins Schild</button>
  <b>Weg und Tempo</b>
  <button data-erg="pass">Über den Pass</button>
</div>
<div id="zeile"></div>
<div id="bps"></div>
<div id="knoepfe"></div>
<div id="karte-info"><button class="zu" aria-label="Schließen">×</button><div id="karte-info-text"></div></div>
<script>const KARTE_BILD_PFAD = '../../Game/bilder/', SPIEL_BILD_PFAD = '../../Game/bilder/', MARSCH_BILD_PFAD = 'bilder/';</script>
<script src="../../Game/spiel/01a2-karte-zonen.js"></script>
<script src="../kartentest/karte_dinge.js"></script>
<script src="marsch_daten.js"></script>
<script src="../kartentest/kartentest.js"></script>
<script src="marschtest.js"></script>
</body>
</html>
