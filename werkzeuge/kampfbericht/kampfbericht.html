<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kampfbericht – Ansicht</title>
<link rel="stylesheet" href="../../Game/schrift/schrift.css">
<link rel="stylesheet" href="spiel_stil.css">
<style>
  /* Nur Ansicht zum Zeigen (neuer Kampfbericht, Vorbild RoK/Lords Mobile). ?a=sieg|niederlage. Zahlen sind Beispiele. */
  body { background: #0d1118 url(../../Game/bilder/karte_boden_mitte.webp) center/cover; }
  body::after { content: ""; position: fixed; inset: 0; background: rgba(0,0,0,.5); pointer-events: none; }
  .wahl { position: fixed; top: 8px; left: 8px; right: 8px; z-index: 6; display: flex; gap: 4px; justify-content: center; }
  .wahl a { padding: 4px 10px; border-radius: 12px; background: rgba(0,0,0,.6); border: 1px solid var(--line-2); color: var(--tx-2); font: 600 11px var(--font-ui); text-decoration: none; }
  .wahl a.on { color: var(--gold-100); border-color: var(--gold-300); }
  .panel.is-open { z-index: 5; animation: none; }
  .panel--sheet { --sheet-max: calc(100dvh - 44px); top: auto; bottom: 0; }
  .kb { display: flex; flex-direction: column; gap: 10px; padding-bottom: 4px; }
  /* Band oben */
  .kb-band { position: relative; height: 104px; margin: -4px -6px 0; display: grid; place-items: center; }
  .kb-band::before { content: ""; position: absolute; inset: -10px -20px; background: radial-gradient(closest-side, var(--glow) , transparent 75%); }
  .kb-band img { position: absolute; height: 104px; left: 50%; transform: translateX(-50%); }
  .kb-band b { position: relative; top: -6px; font: 700 26px/1 var(--font-display, serif); letter-spacing: .06em; color: #fff4d6; text-shadow: 0 2px 0 #4a2f08, 0 0 10px rgba(0,0,0,.6); }
  .kb.niederlage .kb-band b { color: #ffe1dc; text-shadow: 0 2px 0 #3a0c0c, 0 0 10px rgba(0,0,0,.6); }
  .kb-ort { text-align: center; font: 500 12px var(--font-ui); color: var(--tx-3); margin-top: -8px; }
  .kb-ort b { color: var(--tx-2); }
  /* beide Seiten */
  .kb-seiten { display: grid; grid-template-columns: 1fr 26px 1fr; align-items: start; }
  .kb-vs { align-self: center; text-align: center; font: 700 15px var(--font-display, serif); color: var(--gold-300); }
  .kb-seite { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px; border-radius: 12px; border: 1px solid var(--line-1); background: linear-gradient(180deg, rgba(70,110,180,.16), rgba(255,255,255,.02)); }
  .kb-seite.feind { background: linear-gradient(180deg, rgba(190,60,50,.18), rgba(255,255,255,.02)); }
  .kb-kopf { position: relative; width: 64px; height: 64px; }
  .kb-kopf img.h { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid #e4c886; box-shadow: 0 3px 10px rgba(0,0,0,.6); background: #1b2638; }
  .kb-seite.feind .kb-kopf img.h { border-color: #d98a7c; }
  .kb-kopf img.w { position: absolute; right: -10px; bottom: -6px; height: 34px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.7)); }
  .kb-name { font: 700 14px var(--font-display, serif); color: var(--gold-100); text-align: center; line-height: 1.15; }
  .kb-seite.feind .kb-name { color: #f2c6bc; }
  .kb-sub { font: 500 11px var(--font-ui); color: var(--tx-3); text-align: center; }
  .kb-macht { display: flex; gap: 4px; align-items: center; font: 700 13px var(--font-ui); color: var(--tx-1); }
  .kb-macht svg { width: 14px; height: 14px; color: var(--gold-300); }
  /* Truppen-Balken */
  .kb-box { border: 1px solid var(--line-1); border-radius: 12px; background: rgba(255,255,255,.025); padding: 10px 10px 8px; }
  .kb-h { display: flex; justify-content: space-between; align-items: baseline; font: 700 12px var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--gold-300); margin-bottom: 8px; }
  .kb-h small { text-transform: none; letter-spacing: 0; color: var(--tx-3); font-weight: 500; }
  .kb-reihe { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .kb-bar { height: 12px; border-radius: 6px; overflow: hidden; display: flex; background: rgba(0,0,0,.5); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .kb-bar i { display: block; height: 100%; }
  .kb-bar .ue { background: linear-gradient(#7fd47a, #3f9a45); }
  .kb-bar .vw { background: linear-gradient(#f1c35a, #b9821f); }
  .kb-bar .tot { background: linear-gradient(#e0605a, #8f2a26); }
  .kb-zahl { display: grid; grid-template-columns: auto 1fr; gap: 2px 6px; margin-top: 6px; font: 500 12px/1.25 var(--font-ui); color: var(--tx-2); }
  .kb-zahl b { text-align: right; font-weight: 700; color: var(--tx-1); font-variant-numeric: tabular-nums; }
  .kb-zahl span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; background: var(--c); }
  .kb-zahl .start { grid-column: 1 / -1; display: flex; justify-content: space-between; color: var(--tx-3); border-bottom: 1px solid var(--line-1); padding-bottom: 3px; margin-bottom: 1px; }
  .kb-zahl .start b { color: var(--tx-1); }
  /* Beute-Kacheln: Bild + Zahl, Seltenheits-Rahmen */
  .kb-beute { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .kb-k { position: relative; aspect-ratio: 1; border-radius: 10px; border: 1.5px solid var(--rc); background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--rc) 35%, #1a2233), #10151f 80%); box-shadow: inset 0 0 12px color-mix(in srgb, var(--rc) 30%, transparent), 0 2px 6px rgba(0,0,0,.5); }
  .kb-k img { position: absolute; inset: 9% 9% 20%; width: 82%; height: 71%; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
  .kb-k b { position: absolute; left: 0; right: 0; bottom: 3px; text-align: center; font: 800 13px/1 var(--font-ui); color: #fff; text-shadow: 0 1px 2px #000, 0 0 4px #000; }
  .kb-k.minus b { color: #ffb4a8; }
  .r-grau { --rc: #8a93a3; } .r-gruen { --rc: #5fbf5a; } .r-blau { --rc: #4f8fe0; } .r-lila { --rc: #a66be0; } .r-gold { --rc: #e4b44a; }
  .kb-schutz { margin-top: 8px; display: flex; gap: 6px; align-items: center; font: 500 11.5px/1.3 var(--font-ui); color: var(--tx-3); }
  .kb-schutz img { width: 22px; height: 22px; }
  .kb-tipp { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; background: rgba(214,170,90,.1); border: 1px solid rgba(214,170,90,.35); font: 500 12.5px/1.3 var(--font-ui); color: var(--tx-2); }
  .kb-tipp img { width: 34px; height: 34px; flex: none; }
  .kb-knoepfe { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; position: sticky; bottom: 0; padding: 8px 0 2px; background: linear-gradient(transparent, #12161f 30%); }
  .kb-mehr { text-align: center; font: 600 12px var(--font-ui); color: var(--tx-3); }
  .kb-mehr span { border-bottom: 1px dashed var(--line-2); }
  @media (min-width: 700px) { .panel--sheet { max-width: 560px; left: 50%; transform: translateX(-50%); } }
</style>
</head>
<body>
<nav class="wahl" id="wahl"><a href="?a=sieg">Sieg</a><a href="?a=niederlage">Niederlage</a></nav>
<section id="logPopup" class="panel panel--sheet is-open" role="dialog">
  <span class="sheet-grab" aria-hidden="true"></span>
  <header class="phead">
    <div class="emblem emblem--gold"><svg class="icon"><use href="#i-battlelog"/></svg></div>
    <div class="phead-text"><div class="overline" id="kbZeit"></div><h3 class="ptitle">Kampfbericht</h3></div>
    <button class="btn-x" type="button" aria-label="Schließen"><svg class="icon"><use href="#i-close"/></svg></button>
  </header>
  <div class="pbody"><div class="kb" id="kb"></div></div>
</section>
<script src="symbole.js"></script>
<script>
const B = '../../Game/bilder/', f = n => n.toLocaleString('de-DE');
const BSP = {
  sieg: { sieg: 1, zeit: 'Heute 14:32 · Angriff', ort: 'Burg von <b>Graf Ulrich</b> · X 412 Y 238',
    a: { name: 'Du (Alexander)', sub: 'Stufe 24 · Held Ragna', held: 'ragna', macht: 1840000, start: 85000, tot: 3120, vw: 9480 },
    v: { name: 'Graf Ulrich', sub: 'Stufe 21 · Held Otto', held: 'otto', macht: 1310000, start: 72000, tot: 18400, vw: 30150 },
    beute: [['muenzen', 412000, 'gold'], ['holz', 96500, 'blau'], ['stein', 88200, 'blau'], ['eisen', 41750, 'lila'], ['punkte', 2400, 'gruen'], ['splitter', 15, 'lila'], ['schluessel', 1, 'gold']],
    knopf: ['Nochmal angreifen', 'btn--danger btn--gefahr', 'i-attack'] },
  niederlage: { sieg: 0, zeit: 'Heute 09:05 · Verteidigung', ort: 'Deine Burg · X 120 Y 377',
    a: { name: 'Herzogin Mara', sub: 'Stufe 27 · Held Sigrun', held: 'sigrun', macht: 2650000, start: 120000, tot: 6900, vw: 14100, feind: 1 },
    v: { name: 'Du (Alexander)', sub: 'Stufe 24 · Held Bernhard', held: 'bernhard', macht: 1720000, start: 64000, tot: 21800, vw: 33900 },
    beute: [['muenzen', -186000, 'gold'], ['holz', -42300, 'blau'], ['stein', -39800, 'blau'], ['eisen', -18600, 'lila']],
    schutz: 'Burg hat 250.000 Münzen und 1.000.000 je Rohstoff geschützt',
    tipp: 'Gegner war 54 % stärker. Verwundete im Lazarett heilen und einen Schild setzen.',
    knopf: ['Verwundete heilen', 'btn--primary btn--haupt', 'i-upgrade'] }
};
const a = new URLSearchParams(location.search).get('a') || 'sieg', d = BSP[a] || BSP.sieg;
document.querySelectorAll('#wahl a').forEach(x => x.classList.toggle('on', x.href.endsWith(a)));
document.getElementById('kbZeit').textContent = d.zeit;
const seite = (s, feind) => `<div class="kb-seite${feind ? ' feind' : ''}">
  <div class="kb-kopf"><img class="h" src="${B}held_${s.held}_kopf.webp" alt=""><img class="w" src="${B}ui_wappen.webp" alt=""></div>
  <div class="kb-name">${s.name}</div><div class="kb-sub">${s.sub}</div>
  <div class="kb-macht"><svg><use href="#i-attack"/></svg>${f(s.macht)}</div></div>`;
const balken = (s, t) => { const ue = s.start - s.tot - s.vw, p = x => (100 * x / s.start).toFixed(1) + '%';
  return `<div><div class="kb-bar"><i class="ue" style="width:${p(ue)}"></i><i class="vw" style="width:${p(s.vw)}"></i><i class="tot" style="width:${p(s.tot)}"></i></div>
  <div class="kb-zahl"><div class="start"><span style="--c:transparent">${t}</span><b>${f(s.start)}</b></div>
  <span style="--c:#5fbf5a">Übrig</span><b>${f(ue)}</b><span style="--c:#e0a83a">Verwundet</span><b>${f(s.vw)}</b><span style="--c:#d0504a">Gefallen</span><b>${f(s.tot)}</b></div></div>`; };
const kurz = z => z >= 1e6 ? (z / 1e6).toFixed(1).replace('.', ',') + ' Mio' : z >= 1e4 ? Math.round(z / 1000) + 'k' : f(z);
const k = ([n, z, r]) => `<div class="kb-k r-${r}${z < 0 ? ' minus' : ''}"><img src="${B}beute_${n}.webp" alt=""><b>${z < 0 ? '−' : '+'}${kurz(Math.abs(z))}</b></div>`;
document.getElementById('kb').className = 'kb ' + (d.sieg ? 'sieg' : 'niederlage');
document.getElementById('kb').innerHTML =
  `<div class="kb-band" style="--glow:${d.sieg ? 'rgba(240,190,80,.45)' : 'rgba(200,50,40,.45)'}"><img src="${B}marsch_band_${d.sieg ? 'sieg' : 'niederlage'}.webp" alt=""><b>${d.sieg ? 'SIEG' : 'NIEDERLAGE'}</b></div>
  <div class="kb-ort">${d.ort}</div>
  <div class="kb-seiten">${seite(d.a, d.a.feind)}<div class="kb-vs">VS</div>${seite(d.v, !d.a.feind)}</div>
  <div class="kb-box"><div class="kb-h">Truppen<small>Angreifer · Verteidiger</small></div><div class="kb-reihe">${balken(d.a, 'Start')}${balken(d.v, 'Start')}</div></div>
  <div class="kb-box"><div class="kb-h">${d.sieg ? 'Beute' : 'Geraubt'}<small>${d.sieg ? 'kommt mit dem Marsch heim' : 'vom Gegner mitgenommen'}</small></div>
    <div class="kb-beute">${d.beute.map(k).join('')}</div>${d.schutz ? `<div class="kb-schutz"><img src="${B}ui_fo_burgschutz.webp" alt="">${d.schutz}</div>` : ''}</div>
  ${d.tipp ? `<div class="kb-tipp"><img src="${B}ui_sym_verwundete.webp" alt="">${d.tipp}</div>` : ''}
  <div class="kb-mehr"><span>Details: Helden, Boni, Ausrüstung ▾</span></div>
  <div class="kb-knoepfe"><button class="btn btn--secondary btn--haupt" type="button">Teilen</button>
    <button class="btn ${d.knopf[1]}" type="button"><svg class="icon"><use href="#${d.knopf[2]}"/></svg>${d.knopf[0]}</button></div>`;
</script>
</body>
</html>
